<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Dot Matrix Pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.4"/>
      <circle cx="12" cy="12" r="1.2" fill="#334155" opacity="0.4"/>
    </pattern>

    <!-- ASCII Halftone Dot Pattern for Buyer Head (Red Glow) -->
    <pattern id="buyer-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#ef4444" opacity="0.75"/>
    </pattern>

    <!-- ASCII Halftone Dot Pattern for Merchant Head (Blue Glow) -->
    <pattern id="merchant-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#3b82f6" opacity="0.75"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg-grad)"/>
  <rect width="800" height="400" rx="16" fill="url(#dot-grid)"/>

  <!-- Outer Tech Border -->
  <rect x="10" y="10" width="780" height="380" rx="12" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- ASCII Background Matrix Streams -->
  <g opacity="0.2" fill="#38bdf8" font-family="monospace" font-size="11">
    <text x="30" y="38">01000001 01000111 01000101 01001110 01000100</text>
    <text x="540" y="38">AP2_PROTOCOL_V2::SECURE_CHANNEL</text>
    <text x="30" y="375">MCP_SERVER_STATUS::ACTIVE_STREAM</text>
    <text x="560" y="375">LANGGRAPH_AGENT_EXEC::OK</text>
  </g>

  <!-- Central Network Data Bridge (Moving Particles) -->
  <g>
    <!-- Base Dotted Bridge Line -->
    <line x1="220" y1="200" x2="580" y2="200" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Animated Data Stream Line 1 (Left to Right - Buyer to Merchant) -->
    <line x1="220" y1="190" x2="580" y2="190" stroke="#ef4444" stroke-width="2" stroke-dasharray="10 20" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- Animated Data Stream Line 2 (Right to Left - Merchant to Buyer) -->
    <line x1="220" y1="210" x2="580" y2="210" stroke="#3b82f6" stroke-width="2" stroke-dasharray="10 20" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="60" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- Bouncing Data Packets -->
    <circle cx="300" cy="190" r="4" fill="#f87171" filter="url(#glow-red)">
      <animate attributeName="cx" values="220;580;220" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="210" r="4" fill="#60a5fa" filter="url(#glow-blue)">
      <animate attributeName="cx" values="580;220;580" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= BUYER AGENT HEAD (LEFT) ================= -->
  <g filter="url(#glow-red)">
    <!-- Bobbing animation for head -->
    <animateTransform attributeName="transform" type="translate" values="40,0; 40,-8; 40,0" dur="3s" repeatCount="indefinite"/>

    <!-- Dotted Aura Ring -->
    <circle cx="130" cy="200" r="75" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 130 200" to="360 130 200" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="200" r="82" fill="none" stroke="#f87171" stroke-width="1" stroke-dasharray="2 10" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360 130 200" to="0 130 200" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- Cuphead Head Outer Shell -->
    <path d="M 85 170 C 85 125, 175 125, 175 170 C 175 220, 160 245, 130 245 C 100 245, 85 220, 85 170 Z" fill="#1e1e2e" stroke="#ef4444" stroke-width="3"/>
    <!-- Dotted ASCII Matrix Fill Inside Head -->
    <path d="M 88 170 C 88 128, 172 128, 172 170 C 172 217, 158 242, 130 242 C 102 242, 88 217, 88 170 Z" fill="url(#buyer-dots)" opacity="0.35"/>

    <!-- Rim of Cup -->
    <ellipse cx="130" cy="140" rx="42" ry="10" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
    <ellipse cx="130" cy="140" rx="36" ry="6" fill="url(#buyer-dots)" opacity="0.5"/>

    <!-- Cuphead Handle (Left Ear) -->
    <path d="M 86 160 Q 60 160 60 185 Q 60 210 86 210" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6 3"/>

    <!-- Bent Red Straw -->
    <path d="M 145 138 L 155 90 L 175 75" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 145 138 L 155 90 L 175 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>

    <!-- Vintage Pie-Cut Eyes (Digital Red Glow) -->
    <!-- Left Eye -->
    <ellipse cx="112" cy="175" rx="12" ry="16" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="114" cy="175" rx="6" ry="9" fill="#ef4444"/>
    <polygon points="114,175 122,170 122,180" fill="#0f172a"/>

    <!-- Right Eye -->
    <ellipse cx="145" cy="175" rx="12" ry="16" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="147" cy="175" rx="6" ry="9" fill="#ef4444"/>
    <polygon points="147,175 155,170 155,180" fill="#0f172a"/>

    <!-- Cute Red Nose -->
    <ellipse cx="130" cy="190" rx="6" ry="4" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>

    <!-- Cheeky Cuphead Smile -->
    <path d="M 104 205 Q 130 225 156 205" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="130" y1="208" x2="130" y2="216" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Agent Node Label -->
    <rect x="80" y="260" width="100" height="24" rx="6" fill="#1e1015" stroke="#ef4444" stroke-width="1.5"/>
    <text x="130" y="276" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold">[BUYER_AGENT]</text>
  </g>

  <!-- ================= MERCHANT AGENT HEAD (RIGHT) ================= -->
  <g filter="url(#glow-blue)">
    <!-- Bobbing animation for head -->
    <animateTransform attributeName="transform" type="translate" values="-40,-4; -40,4; -40,-4" dur="3.4s" repeatCount="indefinite"/>

    <!-- Dotted Aura Ring -->
    <circle cx="670" cy="200" r="75" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 670 200" to="0 670 200" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="200" r="82" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2 10" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 670 200" to="360 670 200" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Mugman Head Outer Shell -->
    <path d="M 625 170 C 625 125, 715 125, 715 170 C 715 220, 700 245, 670 245 C 640 245, 625 220, 625 170 Z" fill="#1e1e2e" stroke="#3b82f6" stroke-width="3"/>
    <!-- Dotted ASCII Matrix Fill Inside Head -->
    <path d="M 628 170 C 628 128, 712 128, 712 170 C 712 217, 698 242, 670 242 C 642 242, 628 217, 628 170 Z" fill="url(#merchant-dots)" opacity="0.35"/>

    <!-- Rim of Mug -->
    <ellipse cx="670" cy="140" rx="42" ry="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
    <ellipse cx="670" cy="140" rx="36" ry="6" fill="url(#merchant-dots)" opacity="0.5"/>

    <!-- Mugman Handle (Right Ear) -->
    <path d="M 714 160 Q 740 160 740 185 Q 740 210 714 210" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-dasharray="6 3"/>

    <!-- Bent Blue Straw -->
    <path d="M 685 138 L 695 90 L 715 75" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 685 138 L 695 90 L 715 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>

    <!-- Vintage Pie-Cut Eyes (Digital Blue Glow) -->
    <!-- Left Eye -->
    <ellipse cx="652" cy="175" rx="12" ry="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <ellipse cx="654" cy="175" rx="6" ry="9" fill="#3b82f6"/>
    <polygon points="654,175 662,170 662,180" fill="#0f172a"/>

    <!-- Right Eye -->
    <ellipse cx="685" cy="175" rx="12" ry="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <ellipse cx="687" cy="175" rx="6" ry="9" fill="#3b82f6"/>
    <polygon points="687,175 695,170 695,180" fill="#0f172a"/>

    <!-- Big Blue Nose (Mugman signature) -->
    <ellipse cx="670" cy="190" rx="9" ry="6" fill="#3b82f6" stroke="#ffffff" stroke-width="1"/>

    <!-- Confident Smirk -->
    <path d="M 648 208 Q 670 225 692 205" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="670" y1="210" x2="670" y2="217" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Agent Node Label -->
    <rect x="610" y="260" width="120" height="24" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="670" y="276" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">[MERCHANT_AGENT]</text>
  </g>

  <!-- ================= ANIMATED SPEECH & DATA PACKET COMMUNICATIONS ================= -->

  <!-- PHASE 1: BUYER PROPOSES OFFER -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;1;0;0;0;0;0" dur="9s" repeatCount="indefinite"/>
    <!-- Holographic Bubble -->
    <rect x="230" y="90" width="180" height="60" rx="10" fill="#1e1015" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
    <polygon points="250,150 240,168 265,150" fill="#1e1015" stroke="#ef4444" stroke-width="2"/>
    <line x1="251" y1="149" x2="264" y2="149" stroke="#1e1015" stroke-width="3"/>
    
    <text x="320" y="115" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold">PROPOSE: ₹7,000</text>
    <text x="320" y="133" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10">:: TARGET: Base Item ::</text>
  </g>

  <!-- PHASE 2: MERCHANT COUNTER OFFERS BUNDLE -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;1;0;0;0" dur="9s" repeatCount="indefinite"/>
    <!-- Holographic Bubble -->
    <rect x="390" y="90" width="190" height="60" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2" opacity="0.9"/>
    <polygon points="540,150 555,168 525,150" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <line x1="527" y1="149" x2="539" y2="149" stroke="#0f172a" stroke-width="3"/>

    <text x="485" y="115" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">COUNTER: ₹7,500</text>
    <text x="485" y="133" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10">+ FREE Leather Case 🎒</text>
  </g>

  <!-- PHASE 3: DEAL SIGNED & CRYPTOGRAPHICALLY VERIFIED -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite"/>
    <!-- Central Deal Badge -->
    <rect x="300" y="70" width="200" height="75" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2.5" filter="url(#glow-gold)"/>
    <text x="400" y="98" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="bold">⚡ DEAL CONFIRMED! 🤝</text>
    <text x="400" y="118" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">[AP2 Cryptographically Signed]</text>
    <text x="400" y="133" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="9">WhatsApp Approval Sent 📱</text>
  </g>

  <!-- Header Title Tag -->
  <g>
    <rect x="250" y="18" width="300" height="30" rx="15" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">AGENTIC COMMERCE INTERACTION</text>
  </g>
</svg>
