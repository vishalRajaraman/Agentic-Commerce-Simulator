<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Dark Background Dot Grid -->
    <pattern id="bg-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a"/>
    </pattern>

    <!-- White ASCII Matrix Dot Fill for Heads -->
    <pattern id="ascii-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#ffffff" opacity="0.3"/>
    </pattern>

    <!-- Subtle White Glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Black Background -->
  <rect width="800" height="400" rx="12" fill="#000000"/>
  <rect width="800" height="400" rx="12" fill="url(#bg-dots)"/>

  <!-- Crisp Terminal Border -->
  <rect x="10" y="10" width="780" height="380" rx="8" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- ASCII Matrix Header Text -->
  <g fill="#52525b" font-family="monospace" font-size="10">
    <text x="25" y="32">01000001 01000111 01000101 01001110 01000100</text>
    <text x="560" y="32">:: AP2_AGENT_PROTOCOL_V2 ::</text>
    <text x="25" y="380">:: SYSTEM: ACTIVE ::</text>
    <text x="610" y="380">STATUS: OK (200)</text>
  </g>

  <!-- Central White Dotted Data Bridge -->
  <g>
    <line x1="220" y1="200" x2="580" y2="200" stroke="#3f3f46" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- Animated Data Particles Moving Left <-> Right -->
    <line x1="220" y1="200" x2="580" y2="200" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 24" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="64" to="0" dur="2.5s" repeatCount="indefinite"/>
    </line>

    <!-- Floating ASCII Particles -->
    <text y="196" fill="#ffffff" font-family="monospace" font-size="11" opacity="0.8">
      <animate attributeName="x" values="220;550;220" dur="4s" repeatCount="indefinite"/>
      •
    </text>
    <text y="208" fill="#a1a1aa" font-family="monospace" font-size="11" opacity="0.7">
      <animate attributeName="x" values="550;220;550" dur="3.6s" repeatCount="indefinite"/>
      *
    </text>
  </g>

  <!-- ================= LEFT AGENT: BUYER (ROUND HEAD SHAPE) ================= -->
  <g filter="url(#soft-glow)" transform="translate(30, 0)">
    <!-- Natural Bobbing Animation -->
    <animateTransform attributeName="transform" type="translate" values="30,0; 30,-6; 30,0" dur="3.2s" repeatCount="indefinite"/>

    <!-- Outer Dotted Orbit -->
    <circle cx="130" cy="195" r="70" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 5">
      <animateTransform attributeName="transform" type="rotate" from="0 130 195" to="360 130 195" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- ROUND SPHERICAL HEAD (No Straw, No Handle) -->
    <circle cx="130" cy="195" r="54" fill="#09090b" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="130" cy="195" r="52" fill="url(#ascii-dots)"/>

    <!-- 1930s Pie-Cut Eyes (White) -->
    <!-- Left Eye -->
    <ellipse cx="112" cy="185" rx="11" ry="14" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="114" cy="185" rx="6" ry="8" fill="#ffffff"/>
    <polygon points="114,185 122,180 122,190" fill="#000000"/>

    <!-- Right Eye -->
    <ellipse cx="145" cy="185" rx="11" ry="14" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="147" cy="185" rx="6" ry="8" fill="#ffffff"/>
    <polygon points="147,185 155,180 155,190" fill="#000000"/>

    <!-- Nose -->
    <circle cx="129" cy="198" r="4.5" fill="#ffffff"/>

    <!-- Smile -->
    <path d="M 106 210 Q 129 230 152 210" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="129" y1="214" x2="129" y2="222" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Label -->
    <rect x="75" y="262" width="110" height="24" rx="4" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="130" y="278" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">[ BUYER_AGENT ]</text>
  </g>

  <!-- ================= RIGHT AGENT: MERCHANT (TALL OVAL HEAD SHAPE) ================= -->
  <g filter="url(#soft-glow)" transform="translate(-30, 0)">
    <!-- Natural Bobbing Animation -->
    <animateTransform attributeName="transform" type="translate" values="-30,-4; -30,4; -30,-4" dur="3.6s" repeatCount="indefinite"/>

    <!-- Outer Dotted Orbit -->
    <circle cx="670" cy="195" r="70" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 5">
      <animateTransform attributeName="transform" type="rotate" from="360 670 195" to="0 670 195" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- TALL RECTANGULAR-OVAL HEAD (No Straw, No Handle, Different Shape!) -->
    <rect x="622" y="132" width="96" height="124" rx="30" fill="#09090b" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="624" y="134" width="92" height="120" rx="28" fill="url(#ascii-dots)"/>

    <!-- Flat Top Rim Accent -->
    <line x1="635" y1="140" x2="705" y2="140" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Expressive Pie-Cut Eyes (White) -->
    <!-- Left Eye -->
    <ellipse cx="650" cy="182" rx="10" ry="14" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="652" cy="182" rx="5" ry="8" fill="#ffffff"/>
    <polygon points="652,182 660,177 660,187" fill="#000000"/>

    <!-- Right Eye -->
    <ellipse cx="682" cy="182" rx="10" ry="14" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="684" cy="182" rx="5" ry="8" fill="#ffffff"/>
    <polygon points="684,182 692,177 692,187" fill="#000000"/>

    <!-- Nose -->
    <ellipse cx="667" cy="197" rx="7" ry="4.5" fill="#ffffff"/>

    <!-- Confident Smirk -->
    <path d="M 646 210 Q 667 228 688 208" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="667" y1="212" x2="667" y2="220" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Label -->
    <rect x="605" y="262" width="130" height="24" rx="4" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="670" y="278" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">[ MERCHANT_AGENT ]</text>
  </g>

  <!-- ================= MONOCHROME ASCII SPEECH BUBBLES ================= -->

  <!-- PHASE 1: BUYER OFFERS -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;1;0;0;0;0;0" dur="9s" repeatCount="indefinite"/>
    <rect x="220" y="85" width="200" height="60" rx="6" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="245,145 235,162 260,145" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="246" y1="144" x2="259" y2="144" stroke="#09090b" stroke-width="2.5"/>

    <text x="320" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">" Offer: ₹7,000 "</text>
    <text x="320" y="130" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">Target: Base Item</text>
  </g>

  <!-- PHASE 2: MERCHANT COUNTERS -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;1;0;0;0" dur="9s" repeatCount="indefinite"/>
    <rect x="380" y="85" width="200" height="60" rx="6" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="555,145 565,162 540,145" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="541" y1="144" x2="554" y2="144" stroke="#09090b" stroke-width="2.5"/>

    <text x="480" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">" Counter: ₹7,500 "</text>
    <text x="480" y="130" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">+ Free Accessory Bundle</text>
  </g>

  <!-- PHASE 3: DEAL SIGNED -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite"/>
    <rect x="290" y="75" width="220" height="70" rx="8" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <text x="400" y="103" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">⚡ DEAL CONFIRMED 🤝</text>
    <text x="400" y="125" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">[ AP2 Signed &amp; Approved ]</text>
  </g>

  <!-- Header Title Badge -->
  <g>
    <rect x="240" y="16" width="320" height="28" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">AGENTIC COMMERCE SIMULATION</text>
  </g>
</svg>
